# Scopit - Render Deployment Configuration
# Deploy at: https://dashboard.render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Backend runs on the Docker runtime (not native python) because the app needs
# system libraries that the native runtime cannot install:
#   - WeasyPrint (estimate/invoice PDFs) -> libpango, libcairo, libgdk-pixbuf
#   - pdf2image (PDF editor / thumbnails) -> poppler-utils
# These are installed in backend/Dockerfile.

services:
  - type: web
    name: scopit-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      # NeonDB (set in dashboard)
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # CORS - update after Vercel deploy (add your Vercel URL, comma-separated)
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Google OAuth (set in dashboard)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Beta
      - key: BETA_MODE
        value: "True"
      - key: BETA_END_DATE
        value: "2026-06-30"
      # Cloudflare R2 (set in dashboard)
      - key: STORAGE_PROVIDER
        value: r2
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: scopit-uploads
      # External services (set in dashboard)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      # Email (SMTP) - without these, verification/reset emails silently
      # never send (EmailService.is_configured() returns False)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@scopit.work
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      # Item Recommender (semantic search) loads a sentence-transformers/torch
      # model (~500MB-1GB RAM) and needs the gitignored parsed_json dataset, so
      # it is disabled on the free plan. After upgrading to a paid plan with more
      # RAM (and providing the data), set this to "True" to enable it.
      - key: ITEM_RECOMMENDER_ENABLED
        value: "False"
