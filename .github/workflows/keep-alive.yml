# Pings the Render backend every 10 minutes so the free-tier instance never
# idles out and spins down (Render free plan sleeps after ~15 min of no
# traffic; the resulting cold start causes 503s on the next real request).
name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://api.scopit.work/health)
          echo "Health check responded with HTTP $status"
          if [ "$status" -ne 200 ]; then
            echo "::warning::Backend health check returned $status"
          fi
