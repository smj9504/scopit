# Throwaway stack for recording the app screens. Its own Postgres, a Mailpit
# inbox that catches every email, and the backend pointed at both, so nothing
# touches the cloud database and no real email leaves the machine.
#
#   docker compose --env-file ../../.env up -d
#
# Only ANTHROPIC_API_KEY is taken from ../../.env (for Photo AI); every other
# setting is fixed below. Mailpit's inbox: http://localhost:58025
name: scopit-video

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scopit
      POSTGRES_PASSWORD: scopit123
      POSTGRES_DB: scopit_video
    ports:
      - "55441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopit -d scopit_video"]
      interval: 2s
      retries: 30

  # The backend always STARTTLS + logs in, so Mailpit gets a self-signed cert
  # (build/certs, made by the README's openssl line) and accepts any login.
  mail:
    image: axllent/mailpit:v1.27
    command:
      - --smtp-tls-cert=/certs/cert.pem
      - --smtp-tls-key=/certs/key.pem
      - --smtp-auth-accept-any
    volumes:
      - ./build/certs:/certs:ro
    ports:
      - "58025:8025"

  backend:
    image: scopit-video-backend
    build: ../../backend
    # Trust Mailpit's cert on top of the system CAs (SSL_CERT_FILE replaces the
    # default bundle, so the two are joined here or outbound HTTPS breaks).
    command: >
      sh -c "cat /etc/ssl/certs/ca-certificates.crt /certs/cert.pem > /tmp/ca-bundle.pem
      && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8001"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      ENV: local
      DEBUG: "True"
      DATABASE_URL: postgresql://scopit:scopit123@db:5432/scopit_video
      SECRET_KEY: video-demo-only
      CORS_ORIGINS: http://localhost:3001
      FRONTEND_URL: http://localhost:3001
      BETA_MODE: "True"
      BETA_END_DATE: "2026-12-31"
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_USER: demo
      SMTP_PASSWORD: demo
      EMAIL_FROM: no-reply@scopit.work
      EMAIL_FROM_NAME: Scopit
      SIGNUP_NOTIFY_EMAIL: ""
      PACKING_LEAD_NOTIFY_EMAIL: ""
      SSL_CERT_FILE: /tmp/ca-bundle.pem
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ITEM_RECOMMENDER_ENABLED: "False"
      STORAGE_PROVIDER: local
      STORAGE_BASE_DIR: uploads
    volumes:
      - ./build/certs:/certs:ro
    ports:
      - "8001:8001"
