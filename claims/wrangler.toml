# Cloudflare Pages configuration for Scopit Claims.
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# Secrets (RESEND_API_KEY, TURNSTILE_SECRET_KEY, BUTTONDOWN_API_KEY,
# ADMIN_PASSWORD, IP_HASH_SALT, PAGES_DEPLOY_HOOK_URL, ...) are NOT set here.
# Set them in the Cloudflare dashboard (Settings > Variables and Secrets) or
# with `wrangler pages secret put NAME`. Local values go in .dev.vars.

name = "scopit-claims"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# ---- Local development (`npm run preview`) ----
[vars]
CLAIMS_ENV = "development"
CLAIMS_SITE = "http://localhost:8788"
CLAIMS_BASE = ""
EMAIL_PROVIDER = "log"
NEWSLETTER_PROVIDER = "log"

[[d1_databases]]
binding = "DB"
database_name = "scopit-claims"
database_id = "c2792f78-542b-4a6b-b29b-c88d0d605778"   # ENAM (eastern North America)
migrations_dir = "migrations"

# ---- Preview deployments (non-production branches) ----
# Uses its own database so test submissions never touch real listings.
# These vars are also read at BUILD time on Cloudflare (scripts/build-env.mjs).
[env.preview.vars]
CLAIMS_ENV = "preview"
CLAIMS_SITE = "https://preview.scopit-claims.pages.dev"
CLAIMS_BASE = ""
EMAIL_PROVIDER = "resend"
NEWSLETTER_PROVIDER = "log"
CLAIMS_DIRECTORY_SOURCE = "d1"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAF8Ojs7q-_aVIlkt"   # Turnstile widget "scopit-claims" (public value)
PUBLIC_PLAUSIBLE_DOMAIN = ""        # leave empty: no analytics on previews
PUBLIC_CONTACT_EMAIL = "claims@scopit.work"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "scopit-claims-preview"
database_id = "62c4b067-ac2d-46ff-bc47-35f744d913e8"   # ENAM (eastern North America)
migrations_dir = "migrations"

# ---- Production ----
# These vars are also read at BUILD time on Cloudflare (scripts/build-env.mjs).
[env.production.vars]
CLAIMS_ENV = "production"
CLAIMS_SITE = "https://claims.scopit.work"
CLAIMS_BASE = ""
EMAIL_PROVIDER = "resend"
NEWSLETTER_PROVIDER = "buttondown"
CLAIMS_DIRECTORY_SOURCE = "d1"
PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAF8Ojs7q-_aVIlkt"   # Turnstile widget "scopit-claims" (public value)
PUBLIC_PLAUSIBLE_DOMAIN = ""        # analytics off (decided 2026-11-10); set to "claims.scopit.work" to turn on Plausible (paid)
PUBLIC_CONTACT_EMAIL = "claims@scopit.work"

[[env.production.d1_databases]]
binding = "DB"
database_name = "scopit-claims"
database_id = "c2792f78-542b-4a6b-b29b-c88d0d605778"   # ENAM (eastern North America)
migrations_dir = "migrations"
