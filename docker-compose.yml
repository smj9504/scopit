# Scopit - Docker Compose (Local Development)
services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: scopit
      POSTGRES_PASSWORD: scopit123
      POSTGRES_DB: scopit_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopit -d scopit_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    environment:
      - ENV=local
      - DEBUG=True
      # Points at the "db" service (docker network hostname), not localhost -
      # keep this hardcoded even though .env's DATABASE_URL uses localhost for host tooling.
      - DATABASE_URL=postgresql://scopit:scopit123@db:5432/scopit_local
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-5}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-10}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-12}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3001}
      - BETA_MODE=${BETA_MODE:-True}
      - BETA_END_DATE=${BETA_END_DATE:-2026-09-30}
      # Google OAuth (set in .env file)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      # Email (SMTP)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@scopit.work}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Scopit}
      # AI / Vision (Packing Tool)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VISION_BATCH_INTER_ROOM_DELAY=${VISION_BATCH_INTER_ROOM_DELAY:-0.5}
      - VISION_BATCH_MAX_ROOMS=${VISION_BATCH_MAX_ROOMS:-15}
      - VISION_RATE_LIMIT_RETRIES=${VISION_RATE_LIMIT_RETRIES:-3}
      - VISION_RATE_LIMIT_BASE_DELAY=${VISION_RATE_LIMIT_BASE_DELAY:-2.0}
      - ITEM_RECOMMENDER_ENABLED=${ITEM_RECOMMENDER_ENABLED:-True}
      # File Storage
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_BASE_DIR=${STORAGE_BASE_DIR:-uploads}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-scopit-uploads}
      # Geoapify (Address Autocomplete)
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY:-}
      # PDF Editor
      - PDF_MAX_UPLOAD_SIZE_MB=${PDF_MAX_UPLOAD_SIZE_MB:-50}
      - PDF_THUMBNAIL_SIZE=${PDF_THUMBNAIL_SIZE:-300}
      - PDF_SIGN_TOKEN_EXPIRY_DAYS=${PDF_SIGN_TOKEN_EXPIRY_DAYS:-14}
      # Stripe (Phase 2 - not yet wired up)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID_PRO_MONTHLY=${STRIPE_PRICE_ID_PRO_MONTHLY:-}
      - STRIPE_PRICE_ID_PRO_YEARLY=${STRIPE_PRICE_ID_PRO_YEARLY:-}
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
