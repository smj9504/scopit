line-length = 120
target-version = "py311"

[lint]
# Scoped down from ruff's broad implicit defaults (which included FastAPI-incompatible
# rules like B008 flagging Depends() as a bug, plus large-diff style rules like
# UP006/UP045/UP035 typing modernization) to what this codebase actually follows:
# pyflakes (F), core pycodestyle errors (E4/E7/E9), and import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E712",  # `Model.col == True` is the correct SQLAlchemy filter idiom, not a bug
    "E402",  # many modules put `logger = logging.getLogger(__name__)` between import
             # groups; real fix is reordering imports across ~9 files, not a lint suppression
]
