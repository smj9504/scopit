    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scopit.work/" />

    <meta property="og:locale" content="en_US" />

      property="og:description"
      content="Create professional restoration estimates in minutes, not hours. Simple estimating and invoicing software built for restoration contractors."

      name="twitter:description"

    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Scopit",
        "url": "https://scopit.work/",
        "description": "Simple estimating and invoicing software for restoration contractors. Create professional estimates, convert them to invoices, and manage customers.",

        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free beta access"
        },
        "provider": {
          "@type": "Organization",
          "name": "Scopit",
          "url": "https://scopit.work/",
          "email": "hello@scopit.work"
        }
      }

    <!-- PWA Meta Tags -->

    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Safe area insets for notched devices -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }

  <body>
    <div id="root"></div>
