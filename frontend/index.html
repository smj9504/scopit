<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Scopit - Estimating Software for Restoration Contractors</title>
    <meta name="title" content="Scopit - Estimating Software for Restoration Contractors" />
    <meta
      name="description"
      content="Create professional restoration estimates in minutes, not hours. Simple estimating and invoicing software built for restoration contractors. Free beta."
    />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="restoration estimating software, restoration contractor software, estimate software, invoicing software for contractors, restoration invoicing" />
    <link rel="canonical" href="https://www.scopit.work/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.scopit.work/" />
    <meta property="og:site_name" content="Scopit" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Scopit - Estimating Software for Restoration Contractors" />
    <meta
      property="og:description"
      content="Create professional restoration estimates in minutes, not hours. Simple estimating and invoicing software built for restoration contractors."
    />
    <meta property="og:image" content="https://www.scopit.work/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Scopit - Estimating & invoicing for restoration contractors" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.scopit.work/" />
    <meta name="twitter:title" content="Scopit - Estimating Software for Restoration Contractors" />
    <meta
      name="twitter:description"
      content="Create professional restoration estimates in minutes, not hours. Simple estimating and invoicing software built for restoration contractors."
    />
    <meta name="twitter:image" content="https://www.scopit.work/og-image.png" />
    <meta name="twitter:image:alt" content="Scopit - Estimating & invoicing for restoration contractors" />

    <!-- Fonts: preconnect + direct stylesheet link so the browser fetches
         this in parallel with the HTML instead of discovering it only
         after global.css loads (previously a render-blocking @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Scopit",
        "url": "https://www.scopit.work/",
        "description": "Simple estimating and invoicing software for restoration contractors. Create professional estimates, convert them to invoices, and manage customers.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free beta access"
        },
        "provider": {
          "@type": "Organization",
          "name": "Scopit",
          "url": "https://www.scopit.work/",
          "email": "hello@scopit.work"
        }
      }
    </script>

    <!-- Structured Data: Organization (brand entity). Add social profile URLs to
         "sameAs" once they exist (LinkedIn, X, etc.) to strengthen the entity. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Scopit",
        "url": "https://www.scopit.work/",
        "logo": "https://www.scopit.work/apple-touch-icon.png",
        "email": "hello@scopit.work",
        "description": "Estimating and invoicing software for restoration contractors."
      }
    </script>

    <!-- Structured Data: FAQ (mirrors the FAQ section rendered on the landing page) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is the beta really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. During the beta period, all features are completely free. We want your feedback to make Scopit better."
            }
          },
          {
            "@type": "Question",
            "name": "How long will the beta last?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We expect the beta to run for 2-3 months. Beta users will get special pricing when we launch."
            }
          },
          {
            "@type": "Question",
            "name": "Will I lose my data after beta?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. All your estimates, invoices, and customer data will be preserved when we move to full launch."
            }
          },
          {
            "@type": "Question",
            "name": "What kind of feedback are you looking for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Anything that helps us improve: bugs, feature requests, workflow suggestions, or things that feel awkward."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data secure?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. We use industry-standard encryption and secure cloud hosting. Your data is backed up daily."
            }
          }
        ]
      }
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#111827" />
    <meta name="background-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Scopit" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scopit" />
    <!-- iOS home screen only rasterizes PNG, not SVG -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- MS Meta Tags (for Windows) -->
    <meta name="msapplication-TileColor" content="#111827" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Favicon: SVG for modern browsers, PNG fallback for search engines/older UAs -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Safe area insets for notched devices -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
