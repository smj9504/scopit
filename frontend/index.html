<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Scopit - Work Tools for Restoration Contractors</title>
    <meta name="title" content="Scopit - Work Tools for Restoration Contractors" />
    <meta
      name="description"
      content="Price pack-outs, kitchen cabinets and bathrooms. Read roof reports, find line items, get documents signed. Every tool feeds your estimates and invoices."
    />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="restoration contractor software, pack-out estimate, packing estimate software, kitchen cabinet estimate, bathroom estimate software, roof report analysis, restoration estimating software, contractor e-signature, restoration invoicing" />
    <link rel="canonical" href="https://www.scopit.work/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.scopit.work/" />
    <meta property="og:site_name" content="Scopit" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Scopit - Work Tools for Restoration Contractors" />
    <meta
      property="og:description"
      content="Pack-out, kitchen cabinet and bathroom pricing, roof report analysis, line-item recommendations and e-signatures. Every tool feeds your estimates and invoices."
    />
    <meta property="og:image" content="https://www.scopit.work/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Scopit - Work tools for restoration contractors" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.scopit.work/" />
    <meta name="twitter:title" content="Scopit - Work Tools for Restoration Contractors" />
    <meta
      name="twitter:description"
      content="Pack-out, kitchen cabinet and bathroom pricing, roof report analysis, line-item recommendations and e-signatures. Every tool feeds your estimates and invoices."
    />
    <meta name="twitter:image" content="https://www.scopit.work/og-image.png" />
    <meta name="twitter:image:alt" content="Scopit - Work tools for restoration contractors" />

    <!-- Fonts: preconnect + direct stylesheet link so the browser fetches
         this in parallel with the HTML instead of discovering it only
         after global.css loads (previously a render-blocking @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Structured Data: one linked graph, so the brand reads as a single
         entity. Organization, WebSite and SoftwareApplication point at each
         other by @id instead of repeating separate, unlinked Organizations.
         Add social profile URLs as "sameAs" on the Organization once they
         exist (LinkedIn, YouTube, etc.). The Offer is the free beta and ends
         on 2026-12-31: update it, with the FAQ copy, when launch pricing is
         public. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.scopit.work/#organization",
            "name": "Scopit",
            "url": "https://www.scopit.work/",
            "email": "hello@scopit.work",
            "description": "Work tools for restoration contractors, with estimates and invoices as the home base.",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.scopit.work/apple-touch-icon.png",
              "width": 180,
              "height": 180
            },
            "areaServed": "US",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "hello@scopit.work",
              "areaServed": "US",
              "availableLanguage": "English"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.scopit.work/#website",
            "name": "Scopit",
            "url": "https://www.scopit.work/",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://www.scopit.work/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.scopit.work/#software",
            "name": "Scopit",
            "url": "https://www.scopit.work/",
            "description": "Work tools for restoration contractors: price contents pack-outs, kitchen cabinets and bathrooms, read roof reports, find line items, and send documents for e-signature. Every tool feeds Scopit estimates and invoices.",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "publisher": { "@id": "https://www.scopit.work/#organization" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "priceValidUntil": "2026-12-31",
              "availability": "https://schema.org/InStock",
              "url": "https://www.scopit.work/",
              "description": "Free beta access through December 31, 2026, every tool included"
            }
          }
        ]
      }
    </script>

    <!-- Structured Data: FAQ (mirrors the FAQ section rendered on the landing page) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Can I use just one tool?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Each Scopit tool (packing, cabinets, bathrooms, roof reports, line items and PDF e-sign) works on its own, so use only the ones your jobs need. What a tool produces can be carried into a Scopit estimate or invoice."
            }
          },
          {
            "@type": "Question",
            "name": "Can I try it without signing up?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, for packing. The packing demo runs the real Packing Estimator on sample rooms: editing, the estimate math and PDF/Excel export all work, and nothing is saved. Every other tool needs a free account."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data backed up?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, automatically, every day."
            }
          },
          {
            "@type": "Question",
            "name": "What happens after the beta?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The beta runs through December 31, 2026. Your estimates, invoices and customers stay, and beta users get special pricing at launch."
            }
          }
        ]
      }
    </script>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#111827" />
    <meta name="background-color" content="#f9fafb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Scopit" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scopit" />
    <!-- iOS home screen only rasterizes PNG, not SVG -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- MS Meta Tags (for Windows) -->
    <meta name="msapplication-TileColor" content="#111827" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Favicon: SVG for modern browsers, PNG fallback for search engines/older UAs -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Safe area insets for notched devices -->
    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sar: env(safe-area-inset-right);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
